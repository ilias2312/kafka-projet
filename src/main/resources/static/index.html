<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Kafka Real-Time Analytics</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>body{font-family:sans-serif;max-width:700px;margin:30px auto}</style>
</head>
<body>
  <h2>Pages vues en temps reel (fenetre de 5 s)</h2>
  <canvas id="chart" width="600" height="300"></canvas>
  <script>
    const chart = new Chart(document.getElementById('chart'), {
      type: 'bar',
      data: { labels: [], datasets: [{ label: 'Nombre de vues', data: [], backgroundColor: '#4f7cff' }] },
      options: { animation: false, scales: { y: { beginAtZero: true } } }
    });
    new EventSource('/analytics').onmessage = ev => {
      const d = JSON.parse(ev.data);
      chart.data.labels = Object.keys(d);
      chart.data.datasets[0].data = Object.values(d);
      chart.update();
    };
  </script>
</body>
</html>
