
server.port=8082
spring.application.name=kafka-projet

# Definition des deux binders
spring.cloud.stream.binders.kafka.type=kafka
spring.cloud.stream.binders.kstream.type=kstream

# Binder par defaut
spring.cloud.stream.default-binder=kafka

# Configuration du binder Kafka classique
spring.cloud.stream.binders.kafka.environment.spring.cloud.stream.kafka.binder.brokers=localhost:9092

# Configuration du binder Kafka Streams
spring.cloud.stream.binders.kstream.environment.spring.cloud.stream.kafka.streams.binder.brokers=localhost:9092

# Fonctions de l'application
spring.cloud.function.definition=eventSupplier;eventConsumer;analyticsProcessor

# Supplier : production des evenements
spring.cloud.stream.bindings.eventSupplier-out-0.destination=events-input
spring.cloud.stream.bindings.eventSupplier-out-0.binder=kafka
spring.integration.poller.fixed-delay=1000

# Consumer : reception des evenements
spring.cloud.stream.bindings.eventConsumer-in-0.destination=events-input
spring.cloud.stream.bindings.eventConsumer-in-0.group=consumer-group-demo
spring.cloud.stream.bindings.eventConsumer-in-0.binder=kafka

# Kafka Streams : traitement analytique
spring.cloud.stream.bindings.analyticsProcessor-in-0.destination=events-input
spring.cloud.stream.bindings.analyticsProcessor-in-0.binder=kstream

spring.cloud.stream.bindings.analyticsProcessor-out-0.destination=analytics-output
spring.cloud.stream.bindings.analyticsProcessor-out-0.binder=kstream

# Kafka Streams configuration
spring.cloud.stream.kafka.streams.binder.configuration.commit.interval.ms=1000

spring.cloud.stream.kafka.streams.binder.configuration.default.key.serde=org.apache.kafka.common.serialization.Serdes$StringSerde

spring.cloud.stream.kafka.streams.bindings.analyticsProcessor-out-0.producer.valueSerde=org.apache.kafka.common.serialization.Serdes$LongSerde
